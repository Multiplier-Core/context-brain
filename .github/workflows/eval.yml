name: eval

on:
  pull_request:
    paths: ["eval/**", ".github/workflows/eval.yml"]
  push:
    branches: [main]
    paths: ["eval/**", ".github/workflows/eval.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run cb-eval validate
      - run: uv run pytest -q
